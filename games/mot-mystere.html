<script>
    /*
        1. Check if the row is full
            1a. If is not full: check the position of the letter (0, 1, 2, 3, 4)
                1a.a. Fill next position (if position 0 is full, fill position 1)
                1a.b. If last position filled = 4, remove listener
            1b. If is full: check next row
                1b.a. If last row filled is position 4, remove listener
        2. Enter: for each position do:
            2a. If all letters in the row filed, keep going. If not, alert error, you need all 5 letters
            2b. Search the letter in the word
                2b.a. If letter in the same position, change game-letter-inside.bg and keyboard-letter.bg to green
                2b.b. If letter in different position, change game-letter-inside.bg and keyboard-letter.bg to yellow
                2b.c. If not, change game-letter-inside.bg and keyboard-letter.bg to dark gray
        3. Result: 
            3a. If all letters green, then Game Over, WIN
            3b. If not, check turn (row position)
                3b.a. If row position <=3, keep going
                3b.b. If row position = 4, Game Over, LOSE
    */

    let magicWord = 'ADIEU' //temp, ALWAYS UPPER CASE


    let isRowChecked = [false, false, false, false, false] //each element (index) is a row
    let gameStatus = 0 // 0 = pas gagner, 1 = gagner
    let gameEnd = 0 //0 = pas fini, 1 = fini
    let currentRow = 0
    let currentGameLetterPosition = 1 //goes from 1 to 25 positions
    const possibleLetters = ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p', 'a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'z', 'x', 'c', 'v', 'b', 'n', 'm']
    for (const possibleLetter of possibleLetters) {
        document.addEventListener('keydown', function (event) {
            if (event.key === possibleLetter || event.key === possibleLetter.toLocaleUpperCase()) {
                const letter = event.key.toLocaleUpperCase()
                changeGameLetter(letter)
            }
        })
    }

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
            executeCheck(currentGameLetterPosition)
            // alert('hola')
        }
    })

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace') {
            deleteLetter()
        }
    })

    function deleteLetter() {
        if (gameEnd) {
            return
        }

        // si la row actual esta checkeada, no borrar
        // en general, al checkear la row, se tiene que bloquear: no se puede checkear otra vez, no se puede borrar ni agregar nada.

        if (isRowChecked[currentRow]) { 
            //the problem is in executeCheck, because after doing the check, it changes the current row to the next one, therefore jeopardizing this condition.
            //if I do isRowChecked[currentRow - 1], it prohibits the letters of the actual row to be erased because is focusing in the 
            return
        } else {
            const positionToChange = `game-letter-${currentGameLetterPosition - 1}`
            const letterToChange = document.getElementById(positionToChange)
            letterToChange.innerText = null
            currentGameLetterPosition--
        }

    }

    function changeGameLetter(letter) {
        if (gameEnd) {
            return
        }

        if (currentRow == 0 && currentGameLetterPosition === 6) {
            return
        } else if (currentRow == 1 && currentGameLetterPosition === 11) {
            return
        } else if (currentRow == 2 && currentGameLetterPosition === 16) {
            return
        }else if (currentRow == 3 && currentGameLetterPosition === 21) {
            return
        }else {
            //1. Change letter
            const positionToChange = `game-letter-${currentGameLetterPosition}`
            const letterToChange = document.getElementById(positionToChange)
            letterToChange.innerText = letter

            //2. Change next position
            currentGameLetterPosition++
        } 
    }

    function executeCheck(currentGameLetterPosition) {
        // If you won, dont check anymore
        if (gameEnd) {
            return
        }
        
        if (currentGameLetterPosition === 6 || currentGameLetterPosition === 11 || currentGameLetterPosition === 16 || currentGameLetterPosition === 21 || currentGameLetterPosition=== 26) {
            // check word
            let actualPosition = currentGameLetterPosition - 5 
            let correctLetters = 0


            for (let i = 0; i <= 4; i++) {
                // check letter
                let letterId = `game-letter-${actualPosition}`
                let letterElementId = `game-letter-container-${actualPosition}`
                let letterElement = document.getElementById(letterId)
                let letterContainerElement = document.getElementById(letterElementId)
                let letter = letterElement.innerHTML
                letter.toLocaleUpperCase()
                if (letter == magicWord[i]) {
                    //1. Is letter in the same position
                    letterContainerElement.style = 'background-color: lime; color: white'
                    correctLetters++
                } else if (letter == magicWord[0] || letter == magicWord[1] || letter == magicWord[2] || letter == magicWord[3] || letter == magicWord[4]) {
                    //2. Is letter in other position (checking all is better)
                    letterContainerElement.style = 'background-color: rgb(228, 168, 29); color: white'
                } else {
                    //3. Letter is not in the word
                    letterContainerElement.style = 'background-color: rgb(117, 117, 117); color: white'
                }
                actualPosition++ 
            }
            if (correctLetters === 5) {
                gameStatus = 1
                gameEnd = 1
                alert('YOU WON')
            } else {
                if (currentRow === 5) {
                    alert('You lose')
                    gameStatus = 0
                    gameEnd = 1
                } else {
                    isRowChecked[currentRow] = true
                    currentRow++
                }
            }

        } else {
            // validation
            alert('4 letras o menos')
        }
    }
