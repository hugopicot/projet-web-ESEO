<DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu de Mots Mêlés</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        /* --- Style général --- */
        body {
            font-family: 'Inter';font-size: 22px;
            margin-top: 0rem;
        }

        .container {
            background: white;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
            max-width:900px;
            width: 100%;
            height:700px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .zone-jeu {
            display: flex;
            justify-content: space-between;
            gap: 40px;
            margin-top: 20px;
        }

        /* --- Liste des mots --- */
        #mots-a-trouver {
            list-style: none;
            padding: 0;
        }

        #mots-a-trouver li {
            padding: 6px 12px;
            background: #ececec;
            border-radius: 6px;
            margin-bottom: 8px;
            width: 150px;
            font-weight: bold;
            text-align: center;
            transition: 0.2s;
        }

        #mots-a-trouver li.trouve {
            text-decoration: line-through;
            background: #b8f3b3;
        }

        /* --- Grille --- */
        #grille {
            display: grid;
            grid-template-columns: repeat(12, 40px);
            gap: 4px;
        }

        .case {
            width: 40px;
            height: 40px;
            border: 1px solid #444;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            background: #fff;
            border-radius: 5px;
            transition: 0.2s;
        }

        .case:hover {
            background: #d7d7ff;
        }

        .case.selectionnee {
            background: #ffe38c;
        }

        .case.trouvee {
            background: #afffb0 !important;

        }


    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Home</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">
            <li class="nav-item active">
                <a class="nav-link" href="/projet-web-eseo/games/mot-mystere.html">Mot du Jour</span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/projet-web-eseo/games/mot-mele.html">Mots Melees</a>
            </li>
        </div>
    </nav>
    <div class="container">

        <h1>Jeu de Mots Mêlés</h1>
        <div class="zone-jeu">
            <!-- Liste des mots -->
            <div>
                <h3>Mots à trouver :</h3>
                <ul id="mots-a-trouver"></ul>
            </div>
            <div>
                Temps écoulé : <span id="timer">0</span> secondes
            </div>

            <!-- Grille du jeu -->
            <div id="grille"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        // --- Liste de mots ---
        const mots = ["CHAT", "SOLEIL", "MOMILI", "LUNE", "ETOILE", "ARBRE", "MAISON", "FLEUR", "MER", "NEIGE","CHIEN","OISEAU"];

        const taille = 12; // 12x12
        let grille = Array(taille * taille).fill("");

        // --- Afficher les mots à trouver ---
        const liste = document.getElementById("mots-a-trouver");
        mots.forEach(mot => {
            const li = document.createElement("li");
            li.textContent = mot;
            li.id = "mot-" + mot;
            liste.appendChild(li);
        });
        let temps = 0;           // secondes écoulées
          let timerId=null;            // pour stocker l'intervalle
function demarrerTimer() {
    timerId = setInterval(() => {
        temps++;  // on ajoute 1 seconde
        document.getElementById("timer").textContent = temps;
    }, 1000);  // 1000 ms = 1 seconde
}
demarrerTimer();



        // --- Fonction pour placer un mot dans la grille ---
        function placerMot(mot, start) {
            for (let i = 0; i < mot.length; i++) {
                grille[start + i] = mot[i];
            }
        }

        // --- Placer chaque mot dans une ligne différente ---
        mots.forEach((mot, index) => {
            const ligne = index; // 1 mot par ligne
            if (mot.length <= taille) {
                placerMot(mot, ligne * taille);
            }
        });

        // --- Remplir les cases vides avec des lettres aléatoires ---
        for (let i = 0; i < grille.length; i++) {
            if (grille[i] === "") {
                grille[i] = String.fromCharCode(65 + Math.floor(Math.random() * 26));
            }
        }

        // --- Afficher la grille ---
        const grilleDiv = document.getElementById("grille");

        grille.forEach((lettre, index) => {
            const div = document.createElement("div");
            div.classList.add("case");
            div.textContent = lettre;
            div.dataset.index = index;

            div.addEventListener("click", () => {
                div.classList.toggle("selectionnee");
                verifierSelection();
            });

            grilleDiv.appendChild(div);
        });

        // --- Vérifier si un mot est trouvé ---
        function verifierSelection() {
            const selection = [...document.querySelectorAll(".case.selectionnee")]
                .map(c => c.textContent)
                .join("");

            mots.forEach(mot => {
                if (selection === mot) {
                    // Effet visuel dans la grille
                    document.querySelectorAll(".case.selectionnee")
                        .forEach(c => {
                            c.classList.remove("selectionnee");
                            c.classList.add("trouvee");
                        });

                    // Barre le mot dans la liste
                    document.getElementById("mot-" + mot).classList.add("trouve");

                    // Affiche un message
                    alert("Bravo ! Tu as trouvé le mot : " + mot);
                }
            }
           
        );}

    </script>
</body>
</html>
